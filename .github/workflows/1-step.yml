# Name is Step x, where x is the last step number in the exercise.
name: Step 1

# Set these variables to have the correct exercise name and module title.
env:
  EXERCISE_NAME: "ai-training-quality-assurance"
  MODULE_TITLE: "Code Quality Assurance with Agents"

# Define how the workflow is triggered.
on:
  push:
    paths:
      - 'docs/ReviewFindings.md'
      - 'app/tests/**'

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  check_initial_commit:
    name: Check if initial commit
    runs-on: ubuntu-latest
    outputs:
      is-initial: ${{ steps.check.outputs.is-initial }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check commit count
        id: check
        run: |
          commit_count=$(git rev-list --count HEAD)
          echo "is-initial=$([[ $commit_count -eq 1 ]] && echo true || echo false)" >> $GITHUB_OUTPUT

  find_exercise:
    name: Find Exercise Issue
    needs: check_initial_commit
    if: needs.check_initial_commit.outputs.is-initial == 'false'
    uses: ./.github/workflows/find-exercise-issue.yml

  post_checking_message:
    name: Post checking work message
    needs: [find_exercise]
    runs-on: ubuntu-latest
    outputs:
      comment-id: ${{ steps.post.outputs.comment-id }}
    env:
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Post checking work message
        id: post
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.github/markdown-templates/exercise/checking-work.md', 'utf8');

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body
            });
            core.setOutput('comment-id', comment.id);

  run_checks:
    name: Run Checks
    runs-on: ubuntu-latest
    needs: post_checking_message
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ReviewFindings.md exists and is not empty
        run: |
          if [ ! -s docs/ReviewFindings.md ]; then
            echo "docs/ReviewFindings.md is missing or empty"
            exit 1
          fi

      - name: Check tests folder has at least 5 test blocks
        run: |
          test_block_count=$(grep -rEo "it\(|test\(" app/tests/ | wc -l)
          if [ "$test_block_count" -lt 5 ]; then
            echo "Expected at least 5 it( or test( blocks in app/tests/, found $test_block_count"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Run tests
        working-directory: app
        run: npm test

  post_final_content:
    name: Post final content
    needs: [find_exercise, run_checks]
    if: needs.run_checks.result == 'success'
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Disable current workflow
        run: |
          gh workflow disable "${{github.workflow}}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Finish Exercise
    needs: [find_exercise, post_checking_message, run_checks]
    if: needs.run_checks.result == 'success'
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
      ISSUE_URL: ${{ needs.find_exercise.outputs.issue-url }}
      CHECKING_COMMENT_ID: ${{ needs.post_checking_message.outputs.comment-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update issue and build final README
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            function render(path, vars) {
              let text = fs.readFileSync(path, 'utf8');
              for (const [key, value] of Object.entries(vars)) {
                text = text.replaceAll(`{{ ${key} }}`, value);
              }
              return text;
            }
            const finalComment = render('.github/markdown-templates/exercise/exercise-finished.md', {
              title: process.env.MODULE_TITLE,
              login: context.actor,
              repo_full_name: `${context.repo.owner}/${context.repo.repo}`
            });
            const finalReadme = render('.github/markdown-templates/readme/exercise-finished.md', {
              login: context.actor,
              issue_url: process.env.ISSUE_URL
            });
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.CHECKING_COMMENT_ID),
              body: finalComment
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              state: 'closed'
            });
            fs.writeFileSync('README.md', finalReadme);

      - name: Commit and push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Congratulations!🎉"
            git push
          fi

  post_mistake_message:
    name: Post mistake message
    needs: [post_checking_message, run_checks]
    if: always() && needs.run_checks.result == 'failure'
    runs-on: ubuntu-latest
    env:
      CHECKING_COMMENT_ID: ${{ needs.post_checking_message.outputs.comment-id }}

    # Set the feedback message to a proper one in the 'Post mistake message' step.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Post mistake message
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const feedback = "One or more checks failed. Make sure: (1) `docs/ReviewFindings.md` exists and is not empty, (2) `app/tests/` contains a combined total of at least 5 `it(` or `test(` blocks, and (3) `npm test` passes. Check the [Actions](../actions) tab for details.";
            let body = fs.readFileSync('.github/markdown-templates/exercise/step-mistake.md', 'utf8');
            body = body.replaceAll('{{ feedback_message }}', feedback);
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.CHECKING_COMMENT_ID),
              body
            });
